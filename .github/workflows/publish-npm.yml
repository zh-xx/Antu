name: Publish npm

# When it runs: only when started by hand (Actions tab -> Publish npm -> Run workflow). It is not part of the Release
# workflow: the Release makes the tag, the GitHub release and the skill zip; this one publishes the npm package
# @zh-xx/antu and its entry in the MCP registry for a version that is already released (issues #80 and #113).
#
# What it does, in order:
#   1. check: the commit is on main, its version has a tag v<version> on that very commit (so only a released
#      version is published), every check on it has passed; the package is built and tested packed
#      (tools/verify/npm-pack.mjs); `npm publish --dry-run` shows what would go out.
#   2. publish (only when dry_run is off, and only after the maintainer approves the `npm` environment): the npm
#      package, with a provenance statement, then the MCP registry entry. No token is stored anywhere: npm and the
#      registry both accept the identity of this workflow (OpenID Connect).
#
# `npm` off publishes only the MCP registry entry of a version that is already on npm (the entry cannot be changed
# for a version once the registry has it, and npm refuses the same version twice, so each part can be done alone).
#
# DRY RUN IS THE DEFAULT. Publishing to npm cannot be taken back (a version can only be deprecated, and its number
# is never free again), so a real publish is a choice made on purpose.
#
# One-time setup by the maintainer, not done by this file:
#   - in the repository settings, create the environment `npm` and put the maintainer in "Required reviewers";
#   - the FIRST version of the package cannot use the workflow's identity: npm cannot add a trusted publisher to a
#     package that does not exist yet. It is published either by hand from the maintainer's computer, or with this
#     workflow and a SHORT-LIVED TOKEN: run it with `use_token` on. The token is a granular access token from
#     npmjs.com (read and write, limited to the @zh-xx scope, expiring in a few days), stored as a secret named
#     NPM_TOKEN of the `npm` ENVIRONMENT (not of the repository), so only this job can read it, and only after the
#     approval. Delete the token on npmjs.com and the secret in the repository as soon as the first version is out;
#   - then, on npmjs.com, the package's settings -> Trusted Publisher: GitHub Actions, owner zh-xx, repository Antu,
#     workflow file publish-npm.yml, environment npm. From then on every version is published with `use_token` off,
#     with no token anywhere.
# Not yet tried end to end: npm and the registry have not been published to from this workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The commit to publish. Default: the latest commit of main. It must be on main and carry the tag v<version>.'
        required: false
        default: main
      dry_run:
        description: 'Do every check, build and test the package and show what would be published, but publish nothing'
        type: boolean
        default: true
      npm:
        description: 'Publish the npm package. Turn it off to publish only the MCP registry entry of a version that is already on npm'
        type: boolean
        default: true
      registry:
        description: 'Also publish the entry in the MCP registry (only when dry run is off)'
        type: boolean
        default: true
      use_token:
        description: 'FIRST version only: publish with the short-lived token NPM_TOKEN of the npm environment, not the identity of the workflow'
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that this commit can be published
        id: check
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; not publishing"
            exit 1
          fi

          # Only a released version is published: the tag must exist and point at this very commit
          git fetch --quiet --tags origin
          tagged="$(git rev-list -n 1 "refs/tags/${tag}" 2>/dev/null || true)"
          if [ "$tagged" != "$sha" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "::warning::the tag ${tag} is not on this commit ($tagged); a real publish would stop here. Run the Release workflow first."
            else
              echo "::error::the tag ${tag} is not on this commit; run the Release workflow first"
              exit 1
            fi
          fi

          {
            echo "sha=${sha}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Check that CI is green on this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The gate is the one on main, not the one in the tagged commit: a version already released is checked
          # again (the MCP registry entry alone, after a run that stopped half way) and must be judged by today's rules.
          # The jobs of this workflow are left out: a failed `publish` of an earlier run stays red on the commit.
          git fetch --depth 1 origin main
          git show FETCH_HEAD:tools/verify/ci-green.mjs > "$RUNNER_TEMP/ci-green.mjs"
          node "$RUNNER_TEMP/ci-green.mjs" "${{ steps.check.outputs.sha }}" --ignore "$GITHUB_JOB" --ignore publish

      # Build the package, pack it, install the tarball in an empty folder and run it
      - name: The package, packed and run from an empty folder
        run: node tools/verify/npm-pack.mjs

      - name: What would be published (dry run)
        if: ${{ inputs.npm }}
        run: |
          node tools/build-npm.mjs --out "$RUNNER_TEMP/antu-npm"
          cd "$RUNNER_TEMP/antu-npm"
          npm publish --dry-run --access public

  publish:
    needs: check
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    # created in the repository settings, with the maintainer as required reviewer: nothing is published before a
    # person approves it here
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      # As the setup-node documentation shows for publishing: no package cache in a job that publishes (a poisoned cache
      # would end up in what is published), and a recent Node
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # publishing with the identity of the workflow needs npm 11.5.1 or newer
      - name: Use a recent npm
        run: npm install -g npm@^11.5.1

      - name: Build the package
        run: node tools/build-npm.mjs --out "$RUNNER_TEMP/antu-npm"

      # The first version only: with the short-lived token (see the top of this file)
      - name: Publish the npm package (first version, with the short-lived token)
        if: ${{ inputs.npm && inputs.use_token }}
        working-directory: ${{ runner.temp }}/antu-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::use_token is on but the secret NPM_TOKEN of the npm environment is empty"
            exit 1
          fi
          npm publish --access public --provenance

      # Every later version: the identity of the workflow, no token
      - name: Publish the npm package (trusted publisher, no token)
        if: ${{ inputs.npm && !inputs.use_token }}
        working-directory: ${{ runner.temp }}/antu-npm
        run: npm publish --access public --provenance

      # The registry holds only where to get the server, so the version it names must already be on npm: it is
      # asked for (the registry of npm can lag several minutes behind a publish: 0.9.1 took about five, so it is asked for ten)
      - name: Check that this version is on npm
        if: ${{ inputs.registry }}
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "https://registry.npmjs.org/@zh-xx%2fantu/${VERSION}" >/dev/null 2>&1; then
              echo "@zh-xx/antu@${VERSION} is on npm"
              exit 0
            fi
            sleep 20
          done
          echo "::error::@zh-xx/antu@${VERSION} is not on npm; the registry entry would point at nothing"
          exit 1

      - name: Install the registry's publisher
        if: ${{ inputs.registry }}
        working-directory: ${{ runner.temp }}/antu-npm
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish the entry in the MCP registry
        if: ${{ inputs.registry }}
        working-directory: ${{ runner.temp }}/antu-npm
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
