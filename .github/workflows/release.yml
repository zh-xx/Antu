name: Release

# When it runs: only when started by hand (Actions tab -> Release -> Run workflow).
# Why it exists:
# The versioning rules (spec/versioning.md) say "tag vX.Y.Z on the merge commit after merging". Doing that in a
# workflow has two benefits: anyone with write access can click it on the web or on a phone, with no tag pushed from
# a local machine; and publishing to npm later (issue #43) can hang on this same workflow instead of a new process.
#
# What it does: reads the version in package.json at that commit, makes the tag v<version> and a GitHub release whose
# notes are the section of CHANGELOG.md with the same version; packs skills/antu/ (the agent skill) into
# antu-skill-<version>.zip and attaches it to the release, for clients that "import a local skill package"
# (such as WorkBuddy).
#
# Before it publishes, it stops unless:
#   - the commit is on main, the version looks like X.Y.Z, the tag does not exist yet, CHANGELOG has a non-empty section;
#   - every check on the commit has finished and passed (tools/verify/ci-green.mjs);
#   - skills/antu/ is the build of this version (node tools/build-skill.mjs --check): the skill is the state of the
#     last release and is rebuilt in the release PR, so forgetting that stops here;
#   - the zip it just packed, unpacked into an empty folder, passes the skill's own checks
#     (tools/verify/skill-cli.mjs --skill): what users download is what was tested.
# What it does not do: change any file, publish anywhere else, delete anything.
#
# Dry run: with dry_run ticked it does every check and packs and tests the zip, but creates no tag and no release
# (and an existing tag is only a warning, so the latest version can be rehearsed). Use it to try a change to this
# file without releasing anything.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The commit to release. Default: the latest commit of main. It must already be on main.'
        required: false
        default: main
      dry_run:
        description: 'Do every check and test the zip, but create no tag and no release'
        type: boolean
        default: false

permissions:
  contents: write
  checks: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that this commit can be released
        id: check
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          # Only commits already merged into main are released, never a branch
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; not releasing (versioning rules: never release from a branch)"
            exit 1
          fi

          # The version must look like MAJOR.MINOR.PATCH
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the version '$version' in package.json is not MAJOR.MINOR.PATCH"
            exit 1
          fi

          # Stop if the tag already exists: one version number, one commit (a dry run only warns)
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "::warning::the tag ${tag} already exists; a real release would stop here"
            else
              echo "::error::the tag ${tag} already exists"
              exit 1
            fi
          fi

          # CHANGELOG must have a section for this version, and it must not be empty
          awk -v v="## ${version}" '$0==v {f=1; next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## ${version}' section, or it is empty"
            exit 1
          fi

          {
            echo "sha=${sha}"
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      # The commit may be on main and still red: a merge that bypassed the branch rule, or a check that failed
      # after the merge. Every check on it (except this job) must have finished and passed.
      - name: Check that CI is green on this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/verify/ci-green.mjs "${{ steps.check.outputs.sha }}" --ignore "$GITHUB_JOB"

      # The skill must be the build of this version: the guide, field tables, examples and VERSION match the sources,
      # and viewer.html is this version's template
      - name: Check the skill folder
        run: node tools/build-skill.mjs --check

      - name: Pack the skill
        run: |
          set -euo pipefail
          cd skills
          zip -qr "../antu-skill-${{ steps.check.outputs.version }}.zip" antu

      # Test the thing users download, not the folder it was packed from: a file missing from the zip, or a wrong
      # path inside it, shows up here and nowhere else.
      - name: Test the packed zip, unpacked into an empty folder
        env:
          ANTU_REQUIRE_PYTHON: '1'
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          unzip -q "antu-skill-${{ steps.check.outputs.version }}.zip" -d "$dir"
          node tools/verify/skill-cli.mjs --skill "$dir/antu"

      - name: Create the tag and the release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.check.outputs.tag }}" \
            "antu-skill-${{ steps.check.outputs.version }}.zip" \
            --target "${{ steps.check.outputs.sha }}" \
            --title "${{ steps.check.outputs.version }}" \
            --notes-file release-notes.md
          echo "Released ${{ steps.check.outputs.tag }} (commit ${{ steps.check.outputs.sha }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run finished
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run: every check passed. No tag and no release were created." >> "$GITHUB_STEP_SUMMARY"
