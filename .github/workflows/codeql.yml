name: CodeQL

# GitHub's own code scanner. It reads the source for known kinds of security mistakes (injected commands, unsafe
# paths, unescaped input) and lists what it finds under the repository's Security tab. Free for public repositories.
# It reports; it is not one of the checks the branch rule on main requires, so a finding never blocks a merge by
# itself. Python is the skill's make_html.py; JavaScript covers everything else (the engine, the tools).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # every Monday, 04:23 UTC: new rules arrive without any new commit

# Same rule as verify.yml: a new push to a pull request cancels the older run; a push to main has a group of its own
# (the commit), so no run on main is cancelled or replaced.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
