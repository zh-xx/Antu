name: Verify

# When it runs: on every push to main, and on every pull request.
# Why it exists:
# The verifier existed, but only ran when somebody remembered to; two problems in one round were found only because
# somebody happened to run it. A run nobody made went straight into the next commit, and the symptom is often
# "looks fine but is broken". The branch rule on main also requires these jobs (by job name: `verify` and the
# `skill-cli (<system>, <node>)` ones), so renaming a job here means updating that rule.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run still going for the older commit of that pull request: nobody wants
# its result, and it only makes the new run wait. Runs on main are never cancelled: the release workflow needs every
# check of a main commit to finish and pass, and a cancelled check would count as not green.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci rather than npm install: it installs strictly from the lock file, and fails when the lock file and
      # package.json are out of step. It also checks that "somebody clones this and it runs".
      - name: Install dependencies
        run: npm ci

      # The part that needs no browser: build, lint, data and layout, the agent examples, whether the field tables and
      # the validators agree, the twelve MCP steps. This layer must pass.
      - name: Verify (no browser)
        run: npm run verify:fast

      # The part that needs a browser: open the generated HTML over file:// and assert the number of cards, the sizes,
      # the positions of the four overlays, zero outgoing requests, zero console errors.
      # GitHub's runner ships Chrome (findChrome knows /usr/bin/google-chrome).
      - name: Verify (with browser rendering)
        run: npm run verify

      # Upload the screenshot even on failure, so the page shows which step broke
      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot
          path: .verify/screenshot.png
          if-no-files-found: ignore

  # The skill's command line (skills/antu/scripts/antu.mjs) promises "Node 18 or newer, nothing installed beside it",
  # and the Python script (scripts/make_html.py) promises "Python 3, standard library only". This job holds them to
  # it on each system a user may have (Linux, macOS, Windows) and on each Node version we promise: it copies
  # skills/antu/ to a temporary folder with no node_modules and runs every command there. It deliberately does
  # not run npm ci: with the dependencies installed, "nothing to install" could no longer be tested.
  skill-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Skill command line and Python script (${{ matrix.os }}, Node ${{ matrix.node }}, no dependencies installed)
        run: node tools/verify/skill-cli.mjs
        env:
          ANTU_REQUIRE_PYTHON: '1'
